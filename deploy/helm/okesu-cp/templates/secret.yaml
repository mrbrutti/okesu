apiVersion: v1
kind: Secret
metadata:
  name: {{ include "okesu-cp.fullname" . }}
  labels:
    {{- include "okesu-cp.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Required on first boot. Subsequent admin password changes happen via
  # Settings → Users in the UI; this field is ignored after the user exists.
  admin-password: {{ required "adminPassword is required (use --set adminPassword=...)" .Values.adminPassword | quote }}
  webhook-secret: {{ .Values.webhookSecret | quote }}
  {{- if .Values.sessionKey }}
  session-key: {{ .Values.sessionKey | quote }}
  {{- end }}
  {{- if .Values.oidc.clientSecret }}
  oidc-client-secret: {{ .Values.oidc.clientSecret | quote }}
  {{- end }}

# Dev/CI profile bringing up every service the OCI production deployment
# uses, on a laptop. Same code paths as production — different adapters
# wire up at startup.
#
# Usage:
#   cd dev
#   docker compose up -d            # bring up dependencies
#   ../okesu-cp serve --db postgres://okesu:okesu@localhost:5432/okesu \
#       --pubsub-url redis://localhost:6379/0 \
#       --blob-url localhost:9000 --blob-access-key minio --blob-secret-key minio12345 \
#       --blob-bucket okesu-dev --blob-region us-east-1 \
#       --listen :8443 --mgmt-listen :8444 \
#       --admin-password okesu-demo --webhook-secret demo-shared-1
#
# Production-shape services:
#   - Postgres            — relational state (matches OCI DB-PG)
#   - ClickHouse          — events firehose
#   - Redpanda            — Kafka-API queue (matches OCI Streaming)
#   - Redis               — pub/sub fan-out (matches OCI Cache)
#   - MinIO               — S3-compatible blob store (matches OCI Object Storage)
#
# Storage is on volumes so a `docker compose down` doesn't wipe data.
# `docker compose down -v` does, when you want a clean slate.

services:
  postgres:
    image: postgres:16-alpine
    container_name: okesu-dev-postgres
    environment:
      POSTGRES_USER: okesu
      POSTGRES_PASSWORD: okesu
      POSTGRES_DB: okesu
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U okesu"]
      interval: 5s
      timeout: 3s
      retries: 12

  clickhouse:
    # 24.x is the current LTS line; matches what we'd run on OKE.
    image: clickhouse/clickhouse-server:24-alpine
    container_name: okesu-dev-clickhouse
    environment:
      # Single-node config — fine for dev. Production is a 3-node cluster.
      CLICKHOUSE_USER: okesu
      CLICKHOUSE_PASSWORD: okesu
      CLICKHOUSE_DB: okesu_events
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "9000:9000"   # native protocol (Go client)
      - "8123:8123"   # HTTP (debug / clickhouse-client)
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user=okesu", "--password=okesu", "-q", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  redpanda:
    # Kafka-compat broker — single node, KRaft mode. ~150 MB RAM.
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.10
    container_name: okesu-dev-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=localhost:8082
    ports:
      - "9092:9092"   # Kafka
      - "9644:9644"   # Admin API
      - "8082:8082"   # PandaProxy
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: okesu-dev-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2024-12-13T22-19-12Z
    container_name: okesu-dev-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9080:9000"   # S3 API on 9080 to avoid colliding with ClickHouse 9000
      - "9001:9001"   # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Optional: pre-create the bucket the CP expects.
  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
        mc alias set okesu http://minio:9000 minio minio12345 &&
        mc mb -p okesu/okesu-dev || true
      "

volumes:
  pg-data: {}
  clickhouse-data: {}
  redpanda-data: {}
  minio-data: {}
